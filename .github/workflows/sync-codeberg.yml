name: Sync from Codeberg

on:
  schedule:
    - cron: '23 3 * * *' # Daily at 11:23 Asia/Hong_Kong.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-codeberg
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'threeicream/apk-reverse'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Merge Codeberg main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags https://codeberg.org/dabao1955/apk-reverse.git main
          git merge --no-edit FETCH_HEAD
          # shortcut: upstream workflow edits may need manual sync; add workflow permission if required.
          git push origin HEAD:refs/heads/main
